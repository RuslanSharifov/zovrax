name: Build HarvestPulse (Fabric 1.21.10)

on:
  push:
    branches: [main, fix/harvest-pulse-020-render-not-building]
    paths:
      - 'mods/harvest-pulse/**'
      - '.github/workflows/build-harvest-pulse.yml'
  pull_request:
    paths:
      - 'mods/harvest-pulse/**'
      - '.github/workflows/build-harvest-pulse.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Compile and verify HarvestPulse beta 0.2.0
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.1.0'
      - name: Unit-test field limits and readiness calculations
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/harvestpulse-tests
          javac -d /tmp/harvestpulse-tests mods/harvest-pulse/src/main/java/az/zovrax/harvestpulse/FieldMath.java mods/harvest-pulse/tools/FieldMathCheck.java
          java -cp /tmp/harvestpulse-tests FieldMathCheck
      - name: Compile Java/Fabric mod with Yarn 1.21.10
        run: gradle --no-daemon --project-dir mods/harvest-pulse build
      - name: Prevent regression of Not building! region renderer crash
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          root = Path("mods/harvest-pulse/src/main/java/az/zovrax/harvestpulse")
          renderer = (root / "PulseRegionRender.java").read_text()
          client = (root / "HarvestPulseClient.java").read_text()
          assert "VertexConsumerProvider.immediate" in renderer, "Dedicated active buffers required"
          assert "FILLS.draw();" in renderer and "OUTLINES.draw();" in renderer, "Buffer flush in finally required"
          assert "context.consumers()" not in renderer.split("public static void render")[1], "Do not use vanilla borrowed buffers"
          assert "WorldRenderEvents.BEFORE_DEBUG_RENDER.register(PulseRegionRender::render)" in client
          print("HarvestPulse 0.2.0 render-buffer lifecycle regression checks passed")
          PY
      - name: Prepare real 0.2.0 JAR, keep 0.1.0 for rollback
        run: node mods/harvest-pulse/tools/package-release.mjs
      - name: Verify client/server classes, render feature and PNG icon
        shell: bash
        run: |
          set -euo pipefail
          JAR=mods/harvest-pulse/releases/zovrax-harvest-pulse-0.2.0-fabric-1.21.10-renderfix.jar
          test -s "$JAR"
          jar tf "$JAR" | grep -Fx 'fabric.mod.json'
          jar tf "$JAR" | grep -Fx 'az/zovrax/harvestpulse/PulseServer.class'
          jar tf "$JAR" | grep -Fx 'az/zovrax/harvestpulse/PulseRegionRender.class'
          jar tf "$JAR" | grep -Fx 'az/zovrax/harvestpulse/HarvestPulsePositionScreen.class'
          jar tf "$JAR" | grep -Fx 'az/zovrax/harvestpulse/HarvestPulseClient.class'
          jar tf "$JAR" | grep -Fx 'assets/zovrax_harvestpulse/icon.png'
          unzip -t "$JAR" | tail -n 1
          test -s mods/harvest-pulse/releases/zovrax-harvest-pulse-0.1.0-fabric-1.21.10.jar
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build and validate website version/loader download selector
        run: |
          node .github/scripts/build-catalog.mjs
          node .github/scripts/validate-catalog.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: zovrax-harvest-pulse-0.2.0-fabric-1.21.10
          path: mods/harvest-pulse/releases/zovrax-harvest-pulse-0.2.0-fabric-1.21.10-renderfix.jar
          if-no-files-found: error
          retention-days: 30
      - name: Commit verified source, real JAR and release metadata to dedicated branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/fix/harvest-pulse-020-render-not-building'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A mods/harvest-pulse
          if ! git diff --cached --quiet; then
            git commit -m 'fix(harvest-pulse): replace crashing 0.2.0 JAR with corrected renderer'
            git push origin HEAD:refs/heads/fix/harvest-pulse-020-render-not-building
          fi
