name: Build HarvestPulse (Fabric 1.21.10)

on:
  push:
    branches: [main]
    paths:
      - 'mods/harvest-pulse/**'
      - '.github/workflows/build-harvest-pulse.yml'
  pull_request:
    paths:
      - 'mods/harvest-pulse/**'
      - '.github/workflows/build-harvest-pulse.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compile HarvestPulse 0.2.0 (Java 21)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.1.0'
      - name: Check selection limits, overlap and 100-percent rounding
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/harvestpulse-check
          javac -d /tmp/harvestpulse-check \
            mods/harvest-pulse/src/main/java/az/zovrax/harvestpulse/FieldMath.java \
            mods/harvest-pulse/tools/FieldMathCheck.java
          java -cp /tmp/harvestpulse-check FieldMathCheck
      - name: Compile and remap Fabric 1.21.10 JAR
        run: gradle --no-daemon --project-dir mods/harvest-pulse build
      - name: Build and verify 0.2.0 release JAR; preserve 0.1.0
        run: node mods/harvest-pulse/tools/package-release.mjs
      - name: Inspect Fabric metadata, actual Java classes and Mod Menu icon
        shell: bash
        run: |
          set -euo pipefail
          JAR=mods/harvest-pulse/releases/zovrax-harvest-pulse-0.2.0-fabric-1.21.10.jar
          jar tf "$JAR" | grep -Fx 'fabric.mod.json'
          jar tf "$JAR" | grep -Fx 'az/zovrax/harvestpulse/PulseServer.class'
          jar tf "$JAR" | grep -Fx 'az/zovrax/harvestpulse/FieldSelectionRenderer.class'
          jar tf "$JAR" | grep -Fx 'az/zovrax/harvestpulse/HarvestPulseAlerts.class'
          jar tf "$JAR" | grep -Fx 'az/zovrax/harvestpulse/HarvestPulsePositionScreen.class'
          jar tf "$JAR" | grep -Fx 'assets/zovrax_harvestpulse/icon.png'
          unzip -p "$JAR" assets/zovrax_harvestpulse/icon.png | file - | grep 'PNG image data, 64 x 64'
          unzip -p "$JAR" fabric.mod.json | grep -F '"icon": "assets/zovrax_harvestpulse/icon.png"'
          test -f mods/harvest-pulse/releases/zovrax-harvest-pulse-0.1.0-fabric-1.21.10.jar
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate generated Zovrax catalog and release selector
        run: |
          node .github/scripts/build-catalog.mjs
          node .github/scripts/validate-catalog.mjs
          node --test site/js/download-options.test.mjs
      - name: Upload actual remapped 0.2.0 release
        uses: actions/upload-artifact@v4
        with:
          name: harvest-pulse-0.2.0-fabric-1.21.10
          path: mods/harvest-pulse/releases/zovrax-harvest-pulse-0.2.0-fabric-1.21.10.jar
          if-no-files-found: error
          retention-days: 30
