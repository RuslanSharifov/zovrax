name: Build Biome Tracker (Fabric 1.21.10)

on:
  push:
    branches: [feat/biome-tracker-fabric-12110, fix/biome-tracker-release-download]
    paths:
      - 'mods/biome-tracker/**'
      - '.github/workflows/build-biome-tracker.yml'
  pull_request:
    paths:
      - 'mods/biome-tracker/**'
      - '.github/workflows/build-biome-tracker.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fabric-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.1.0'
      - name: Compile and package Fabric mod
        run: gradle --no-daemon --project-dir mods/biome-tracker build
      - name: Verify mod archive
        shell: bash
        run: |
          set -euo pipefail
          JAR=mods/biome-tracker/build/libs/zovrax-biome-tracker-0.1.0.jar
          test -f "$JAR"
          jar tf "$JAR" | grep -Fx 'fabric.mod.json'
          jar tf "$JAR" | grep -Fx 'az/zovrax/biometracker/BiomeTrackerClient.class'
          unzip -p "$JAR" fabric.mod.json | grep -q '"id": "zovrax_biome_tracker"'
      - name: Commit release JAR to the release-fix branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/fix/biome-tracker-release-download'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p mods/biome-tracker/releases
          cp mods/biome-tracker/build/libs/zovrax-biome-tracker-0.1.0.jar mods/biome-tracker/releases/zovrax-biome-tracker-0.1.0-fabric-1.21.10.jar
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mods/biome-tracker/releases/zovrax-biome-tracker-0.1.0-fabric-1.21.10.jar
          if ! git diff --cached --quiet; then
            git commit -m "release(biome-tracker): add Fabric 1.21.10 beta JAR"
            git push origin HEAD
          fi
      - name: Validate Zovrax catalog
        run: |
          node .github/scripts/build-catalog.mjs
          node .github/scripts/validate-catalog.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: zovrax-biome-tracker-0.1.0-fabric-1.21.10
          path: mods/biome-tracker/build/libs/zovrax-biome-tracker-0.1.0.jar
          if-no-files-found: error
