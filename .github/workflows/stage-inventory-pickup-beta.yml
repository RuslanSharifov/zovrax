# One-off preview build: this workflow exists only on the release preparation
# branch and is removed BEFORE the pull request merges into main.
name: Stage Inventory Pickup 0.1.0 beta JAR
on:
  push:
    branches:
      - release/inventory-pickup-0-1-0-beta
permissions:
  contents: write
jobs:
  stage-beta:
    if: github.repository == 'RuslanSharifov/zovrax'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/inventory-pickup-0-1-0-beta
          persist-credentials: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.1.0'
      - name: Compile true Fabric 1.21.10 JAR
        run: gradle --no-daemon --project-dir mods/inventory-pickup build
      - name: Check exact mod ID, target and version
        shell: bash
        run: |
          set -euo pipefail
          JAR="mods/inventory-pickup/build/libs/zovrax-inventory-pickup-0.1.0.jar"
          test -s "$JAR"
          unzip -p "$JAR" fabric.mod.json > /tmp/zovrax-preview-mod.json
          python3 - <<'PY'
          import json
          m = json.load(open("/tmp/zovrax-preview-mod.json"))
          assert m["id"] == "zovrax_inventory_pickup"
          assert m["version"] == "0.1.0"
          assert m["depends"]["minecraft"] == "1.21.10"
          assert m["environment"] == "client"
          print("Preview JAR manifest verified.")
          PY
      - name: Commit the real compiled JAR to release prep branch
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p mods/inventory-pickup/releases
          cp mods/inventory-pickup/build/libs/zovrax-inventory-pickup-0.1.0.jar \
            mods/inventory-pickup/releases/zovrax-inventory-pickup-0.1.0-fabric-1.21.10.jar
          sha256sum mods/inventory-pickup/releases/*.jar
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mods/inventory-pickup/releases/zovrax-inventory-pickup-0.1.0-fabric-1.21.10.jar
          git commit -m "build: stage real Inventory Pickup 0.1.0 Fabric beta JAR"
          git push origin HEAD:refs/heads/release/inventory-pickup-0-1-0-beta
