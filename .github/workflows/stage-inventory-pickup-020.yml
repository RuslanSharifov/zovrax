name: Stage Inventory Pickup 0.2.0 beta
on:
  push:
    branches: [feat/inventory-pickup-visual-settings-v020]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-beta:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.1.0'
      - name: Build remapped mod
        run: gradle --no-daemon --project-dir mods/inventory-pickup build
      - name: Verify and commit JAR
        shell: bash
        run: |
          set -euo pipefail
          jarfile="mods/inventory-pickup/build/libs/zovrax-inventory-pickup-0.2.0.jar"
          test -s "$jarfile"
          unzip -p "$jarfile" fabric.mod.json > /tmp/manifest.json
          python3 - <<'PY'
          import json
          m=json.load(open('/tmp/manifest.json'))
          assert m['id']=='zovrax_inventory_pickup'
          assert m['version']=='0.2.0'
          assert m['environment']=='client'
          assert m['depends']['minecraft']=='1.21.10'
          PY
          mkdir -p mods/inventory-pickup/releases
          cp "$jarfile" mods/inventory-pickup/releases/zovrax-inventory-pickup-0.2.0-fabric-1.21.10.jar
          sha256sum mods/inventory-pickup/releases/zovrax-inventory-pickup-0.2.0-fabric-1.21.10.jar
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mods/inventory-pickup/releases/zovrax-inventory-pickup-0.2.0-fabric-1.21.10.jar
          git commit -m "build: stage compiled Inventory Pickup 0.2.0 beta jar"
          git push origin HEAD:refs/heads/feat/inventory-pickup-visual-settings-v020
