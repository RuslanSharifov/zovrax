name: Stage Inventory Pickup 0.2.1 beta JAR
on:
  push:
    branches: [fix/inventory-pickup-ground-events-021]
permissions:
  contents: write
jobs:
  stage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.1.0'
      - name: Compile
        run: gradle --no-daemon --project-dir mods/inventory-pickup build
      - name: Verify and stage binary
        shell: bash
        run: |
          set -euo pipefail
          file="mods/inventory-pickup/build/libs/zovrax-inventory-pickup-0.2.1.jar"
          test -s "$file"
          unzip -p "$file" fabric.mod.json > /tmp/zovrax-manifest.json
          python3 - <<'PY'
          import json,zipfile
          m=json.load(open('/tmp/zovrax-manifest.json'))
          assert m['id']=='zovrax_inventory_pickup'
          assert m['version']=='0.2.1'
          assert m['depends']['minecraft']=='1.21.10'
          assert m['environment']=='client'
          with zipfile.ZipFile('mods/inventory-pickup/build/libs/zovrax-inventory-pickup-0.2.1.jar') as z:
              assert 'zovrax_inventory_pickup.mixins.json' in z.namelist()
              assert 'az/zovrax/inventorypickup/PickupPacketMixin.class' in z.namelist()
          PY
          cp "$file" mods/inventory-pickup/releases/zovrax-inventory-pickup-0.2.1-fabric-1.21.10.jar
          sha256sum mods/inventory-pickup/releases/zovrax-inventory-pickup-0.2.1-fabric-1.21.10.jar
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mods/inventory-pickup/releases/zovrax-inventory-pickup-0.2.1-fabric-1.21.10.jar
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "build: stage compiled Inventory Pickup 0.2.1 beta JAR"
          git push origin HEAD:refs/heads/fix/inventory-pickup-ground-events-021
