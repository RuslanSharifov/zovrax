name: Build Aurora shaderpack beta ZIP

on:
  push:
    branches: [feature/zovrax-aurora-shaderpack]
    paths:
      - 'shaders/zovrax-aurora/src/**'
      - 'shaders/zovrax-aurora/scripts/**'
      - '.github/workflows/build-aurora.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compile-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install GLSL compiler
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq glslang-tools
      - name: Validate every shader stage
        run: node shaders/zovrax-aurora/scripts/check-glsl.mjs
      - name: Build reproducible real shaderpack ZIP
        run: |
          node shaders/zovrax-aurora/scripts/build.mjs
          node shaders/zovrax-aurora/scripts/build.mjs --check
          unzip -t shaders/zovrax-aurora/releases/zovrax-aurora-0.1.0-beta.zip
      - name: Commit built release to feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add shaders/zovrax-aurora/releases/zovrax-aurora-0.1.0-beta.zip
          if ! git diff --cached --quiet; then
            git commit -m "build(shader): publish reproducible Aurora 0.1.0 beta ZIP"
            git push origin HEAD:feature/zovrax-aurora-shaderpack
          fi
