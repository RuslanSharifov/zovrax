name: Stage ArmorLine 0.1.0 beta
on:
  push:
    branches: [feat/armorline-fabric-12110]
permissions:
  contents: write
jobs:
  stage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.1.0'
      - name: Compile ArmorLine for Fabric 1.21.10
        run: gradle --no-daemon --project-dir mods/armorline build
      - name: Verify and stage real mod binary
        shell: bash
        run: |
          set -euo pipefail
          jarfile="mods/armorline/build/libs/zovrax-armorline-0.1.0.jar"
          test -s "$jarfile"
          python3 - <<'PY'
          import zipfile,json
          path="mods/armorline/build/libs/zovrax-armorline-0.1.0.jar"
          with zipfile.ZipFile(path) as archive:
              m=json.loads(archive.read("fabric.mod.json"))
              assert m["id"]=="zovrax_armorline"
              assert m["version"]=="0.1.0"
              assert m["environment"]=="client"
              assert m["depends"]["minecraft"]=="1.21.10"
              assert m.get("mixins") is None
              for entry in ("ArmorLineClient","ArmorConfig","ArmorHud","ArmorSettingsScreen","ArmorPositionScreen","ArmorSlider"):
                  assert f"az/zovrax/armorline/{entry}.class" in archive.namelist(),entry
          PY
          mkdir -p mods/armorline/releases
          cp "$jarfile" mods/armorline/releases/zovrax-armorline-0.1.0-fabric-1.21.10.jar
          sha256sum mods/armorline/releases/zovrax-armorline-0.1.0-fabric-1.21.10.jar
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mods/armorline/releases/zovrax-armorline-0.1.0-fabric-1.21.10.jar
          if ! git diff --cached --quiet; then
            git commit -m "build: stage verified ArmorLine 0.1.0 beta JAR"
            git fetch origin feat/armorline-fabric-12110
            git rebase origin/feat/armorline-fabric-12110
            git push origin HEAD:refs/heads/feat/armorline-fabric-12110
          fi
