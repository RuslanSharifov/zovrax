name: Stage final ArmorLine 0.2.0 binary
on:
  push:
    branches: [feat/armorline-020-hud-controls]
permissions:
  contents: write
jobs:
  stage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.1.0'
      - name: Compile ArmorLine Fabric 1.21.10
        run: gradle --no-daemon --project-dir mods/armorline build
      - name: Validate and stage compiled binary
        shell: bash
        run: |
          set -euo pipefail
          jarfile="mods/armorline/build/libs/zovrax-armorline-0.2.0.jar"
          test -s "$jarfile"
          python3 - <<'PY'
          import json,zipfile
          p="mods/armorline/build/libs/zovrax-armorline-0.2.0.jar"
          with zipfile.ZipFile(p) as jar:
            manifest=json.loads(jar.read("fabric.mod.json"))
            assert manifest["id"]=="zovrax_armorline",manifest
            assert manifest["version"]=="0.2.0",manifest
            assert manifest["depends"]["minecraft"]=="1.21.10"
            assert manifest["environment"]=="client"
            assert "mixins" not in manifest
            for cls in ("ArmorLineClient","ArmorConfig","ArmorHud","ArmorSettingsScreen","ArmorPositionScreen","ArmorSlider"):
              assert f"az/zovrax/armorline/{cls}.class" in jar.namelist(),cls
          PY
          mkdir -p mods/armorline/releases
          cp "$jarfile" mods/armorline/releases/zovrax-armorline-0.2.0-fabric-1.21.10.jar
          sha256sum mods/armorline/releases/zovrax-armorline-0.2.0-fabric-1.21.10.jar
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mods/armorline/releases/zovrax-armorline-0.2.0-fabric-1.21.10.jar
          if ! git diff --cached --quiet; then
            git commit -m "build: stage validated ArmorLine 0.2.0 beta JAR"
            git fetch origin feat/armorline-020-hud-controls
            git rebase origin/feat/armorline-020-hud-controls
            git push origin HEAD:refs/heads/feat/armorline-020-hud-controls
          fi
