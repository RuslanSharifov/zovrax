name: Stage Inventory Pickup 0.2.2 beta JAR
on:
  push:
    branches: [fix/inventory-pickup-mixin-crash-022]
permissions:
  contents: write
jobs:
  stage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.1.0'
      - name: Build Minecraft 1.21.10 Fabric mod
        run: gradle --no-daemon --project-dir mods/inventory-pickup build
      - name: Check compiled mixin and stage JAR
        shell: bash
        run: |
          set -euo pipefail
          jarfile="mods/inventory-pickup/build/libs/zovrax-inventory-pickup-0.2.2.jar"
          test -s "$jarfile"
          python3 - <<'PY'
          import json,zipfile
          name="mods/inventory-pickup/build/libs/zovrax-inventory-pickup-0.2.2.jar"
          with zipfile.ZipFile(name) as z:
              manifest=json.loads(z.read("fabric.mod.json"))
              config=json.loads(z.read("zovrax_inventory_pickup.mixins.json"))
              assert manifest["version"]=="0.2.2",manifest
              assert manifest["id"]=="zovrax_inventory_pickup"
              assert manifest["depends"]["minecraft"]=="1.21.10"
              assert config["package"]=="az.zovrax.inventorypickup.mixin"
              assert config["client"]==["PickupPacketMixin"]
              assert "az/zovrax/inventorypickup/mixin/PickupPacketMixin.class" in z.namelist()
              assert "az/zovrax/inventorypickup/InventoryPickupClient.class" in z.namelist()
              assert "az/zovrax/inventorypickup/PickupPacketMixin.class" not in z.namelist()
          PY
          cp "$jarfile" mods/inventory-pickup/releases/zovrax-inventory-pickup-0.2.2-fabric-1.21.10.jar
          sha256sum mods/inventory-pickup/releases/zovrax-inventory-pickup-0.2.2-fabric-1.21.10.jar
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mods/inventory-pickup/releases/zovrax-inventory-pickup-0.2.2-fabric-1.21.10.jar
          if ! git diff --cached --quiet; then
            git commit -m "build: add verified Inventory Pickup 0.2.2 JAR"
            git push origin HEAD:refs/heads/fix/inventory-pickup-mixin-crash-022
          fi
