name: Validate catalog and site

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate catalog and site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript
        run: |
          node --check site/js/views/mod.js
          node --check site/js/components/download-dialog.js
          node --check site/js/download-options.js
          node --check site/js/views/support.js
          node --check site/js/views/account.js
          node --check site/js/community.js
          node --check site/js/components/mod-card.js
          node --check community-worker/src/index.js
          node --check site/js/layout.js
          node --check site/js/views/contribute.js
          node --check .github/scripts/build-catalog.mjs
          node --check .github/scripts/build-seo.mjs
          node --check .github/scripts/seo-utils.mjs
          node --check .github/scripts/seo.test.mjs
          node --check site/app.js
          node --check site/guide.js
          node --check .github/scripts/validate-catalog.mjs
      - name: Test release picker availability rules
        run: node --test site/js/download-options.test.mjs
      - name: Generate catalog from per-mod metadata and site Markdown
        run: node .github/scripts/build-catalog.mjs
      - name: Validate generated crawlable mod pages, SEO tags and structured data
        run: node --test .github/scripts/seo.test.mjs
      - name: Validate catalog
        run: node .github/scripts/validate-catalog.mjs
