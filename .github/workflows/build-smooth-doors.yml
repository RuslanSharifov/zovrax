name: Build Smooth Doors (Fabric 1.21.10)

on:
  push:
    branches: [fix/smooth-doors-static-render-12110]
    paths:
      - 'mods/smooth-doors/**'
      - '.github/workflows/build-smooth-doors.yml'
  pull_request:
    paths:
      - 'mods/smooth-doors/**'
      - '.github/workflows/build-smooth-doors.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fabric-build:
    name: Compile, test and package Smooth Doors 0.1.1
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.1.0'
      - name: Headless easing and reversal tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/smooth-tests
          javac -d /tmp/smooth-tests mods/smooth-doors/src/main/java/az/zovrax/smoothdoors/AnimationCurve.java mods/smooth-doors/tools/AnimationCurveCheck.java
          java -cp /tmp/smooth-tests AnimationCurveCheck
      - name: Assert no fullbright and no drawing before mesh handoff
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'if (motion.phase == DoorMotion.Phase.WAIT_HIDE) continue' mods/smooth-doors/src/main/java/az/zovrax/smoothdoors/MotionRenderer.java
          grep -F 'LevelRenderer.getLightColor(level, pos)' mods/smooth-doors/src/main/java/az/zovrax/smoothdoors/MotionRenderer.java
          ! grep -F '15728880' mods/smooth-doors/src/main/java/az/zovrax/smoothdoors/MotionRenderer.java
      - name: Compile and remap real Fabric JAR
        run: gradle --no-daemon --project-dir mods/smooth-doors build
      - name: Package only verified 0.1.1 and preserve 0.1.0
        run: node mods/smooth-doors/tools/package-release.mjs
      - name: Validate JAR and Zovrax release catalog
        shell: bash
        run: |
          set -euo pipefail
          jar tf mods/smooth-doors/releases/zovrax-smooth-doors-0.1.1-fabric-1.21.10.jar | grep -Fx 'fabric.mod.json'
          jar tf mods/smooth-doors/releases/zovrax-smooth-doors-0.1.1-fabric-1.21.10.jar | grep -Fx 'az/zovrax/smoothdoors/mixin/SectionMeshMixin.class'
          node .github/scripts/build-catalog.mjs
          node .github/scripts/validate-catalog.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: zovrax-smooth-doors-0.1.1-fabric-1.21.10
          path: mods/smooth-doors/releases/zovrax-smooth-doors-0.1.1-fabric-1.21.10.jar
          if-no-files-found: error
      - name: Commit real beta and metadata back to feature branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/fix/smooth-doors-static-render-12110'
        shell: bash
        run: |
          set -euo pipefail
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git config user.name 'github-actions[bot]'
          git add -A mods/smooth-doors
          if ! git diff --cached --quiet; then
            git commit -m 'release(smooth-doors): add compiled Fabric 0.1.1 visual fix beta'
            git push origin HEAD:refs/heads/fix/smooth-doors-static-render-12110
          fi
