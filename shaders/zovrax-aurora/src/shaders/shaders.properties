# Zovrax Aurora - Iris/OptiFine-compatible shaderpack menu directives.
# A lightweight procedural sky replaces vanilla clouds.
clouds=off
oldLighting=false
sun=false
moon=false
stars=false

screen=<profile> <empty> [SHADOW] [SKY] [CLOUD] [FOLIAGE] [WATER] [POST]
screen.columns=2
screen.SHADOW=SHADOWS NIGHT_SHADOWS SOFT_SHADOWS shadowMapResolution shadowDistance SHADOW_SAMPLES SHADOW_SOFTNESS LEAF_TRANSMISSION LEAF_SHADOW_DITHER LEAF_DITHER_AMOUNT LEAF_LIGHT_STRENGTH NIGHT_LIGHT SUNLIGHT_STRENGTH CLOUD_SHADOWS
screen.SKY=NIGHT_STARS STAR_DENSITY STAR_BRIGHTNESS SUN_GLOW MOON_GLOW SUN_SHAFTS SUN_SHAFT_STRENGTH SUN_SHAFT_SAMPLES ATMOSPHERIC_HAZE AURORA_BOREALIS
screen.CLOUD=PROCEDURAL_CLOUDS CLOUD_DETAIL CLOUD_COVERAGE CLOUD_DENSITY CLOUD_SPEED CLOUD_SCALE CLOUD_HEIGHT
screen.FOLIAGE=WAVING_LEAVES WAVING_PLANTS WIND_STRENGTH WIND_SPEED
screen.WATER=WATER_WAVES WATER_REFLECTIONS SUN_REFLECTIONS WATER_WAVE_HEIGHT WATER_OPACITY WATER_REFLECTIVITY
screen.POST=TONEMAPPING EXPOSURE SATURATION CONTRAST SSAO SSAO_STRENGTH BLOOM BLOOM_STRENGTH VIGNETTE VIGNETTE_STRENGTH
screen.SHADOW.columns=2
screen.SKY.columns=2
screen.CLOUD.columns=2
screen.FOLIAGE.columns=2
screen.WATER.columns=2
screen.POST.columns=2
sliders=shadowDistance shadowMapResolution SHADOW_SOFTNESS LEAF_DITHER_AMOUNT LEAF_LIGHT_STRENGTH NIGHT_LIGHT SUNLIGHT_STRENGTH SUN_SHAFT_STRENGTH WIND_STRENGTH WIND_SPEED WATER_WAVE_HEIGHT WATER_OPACITY WATER_REFLECTIVITY CLOUD_COVERAGE CLOUD_DENSITY CLOUD_SPEED CLOUD_SCALE CLOUD_HEIGHT STAR_DENSITY STAR_BRIGHTNESS EXPOSURE SATURATION CONTRAST BLOOM_STRENGTH SSAO_STRENGTH VIGNETTE_STRENGTH

# Balanced is the shipped default. FAST strips costly screen-space effects.
profile.FAST=!SHADOWS !NIGHT_SHADOWS !SOFT_SHADOWS !SUN_SHAFTS !CLOUD_SHADOWS !SSAO !BLOOM !AURORA_BOREALIS PROCEDURAL_CLOUDS CLOUD_DETAIL:2 CLOUD_COVERAGE:0.52 WAVING_LEAVES WAVING_PLANTS WATER_WAVES WATER_REFLECTIONS
profile.BALANCED=SHADOWS NIGHT_SHADOWS SOFT_SHADOWS LEAF_TRANSMISSION LEAF_SHADOW_DITHER WAVING_LEAVES WAVING_PLANTS WATER_WAVES WATER_REFLECTIONS SUN_REFLECTIONS PROCEDURAL_CLOUDS NIGHT_STARS SUN_SHAFTS ATMOSPHERIC_HAZE TONEMAPPING VIGNETTE !CLOUD_SHADOWS !SSAO !BLOOM !AURORA_BOREALIS shadowMapResolution:1024 shadowDistance:64.0 SHADOW_SAMPLES:2 CLOUD_DETAIL:2
profile.HIGH=profile.BALANCED CLOUD_SHADOWS SSAO BLOOM shadowMapResolution:1536 shadowDistance:96.0 SHADOW_SAMPLES:4 CLOUD_DETAIL:3 SUN_SHAFT_SAMPLES:6
profile.ULTRA=profile.HIGH AURORA_BOREALIS shadowMapResolution:2048 shadowDistance:128.0 CLOUD_DETAIL:4 SUN_SHAFT_SAMPLES:8
