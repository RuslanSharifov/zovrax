# Zovrax Aurora - Iris/OptiFine-compatible shaderpack menu directives.
# A lightweight procedural sky replaces vanilla clouds.
clouds=off
oldLighting=false
sun=false
moon=false
stars=false

screen=<profile> <empty> [SHADOW] [SKY] [CLOUD] [FOLIAGE] [WATER] [POST]
screen.columns=2
screen.SHADOW=SHADOWS NIGHT_SHADOWS SOFT_SHADOWS shadowMapResolution shadowDistance SHADOW_SAMPLES SHADOW_SOFTNESS LEAF_TRANSMISSION LEAF_SHADOW_DITHER LEAF_DITHER_AMOUNT LEAF_LIGHT_STRENGTH NIGHT_LIGHT SUNLIGHT_STRENGTH SHADOW_CONTRAST SUN_WARMTH TORCH_WARMTH CLOUD_SHADOWS
screen.SKY=NIGHT_STARS STAR_DENSITY STAR_BRIGHTNESS SUN_GLOW MOON_GLOW SUN_SHAFTS SUN_SHAFT_STRENGTH SUN_SHAFT_SAMPLES ATMOSPHERIC_HAZE DISTANCE_FOG FOG_DISTANCE FOG_STRENGTH AURORA_BOREALIS
screen.CLOUD=PROCEDURAL_CLOUDS CLOUD_DETAIL CLOUD_COVERAGE CLOUD_DENSITY CLOUD_SPEED CLOUD_SCALE CLOUD_HEIGHT
screen.FOLIAGE=WAVING_LEAVES WAVING_PLANTS WIND_STRENGTH WIND_SPEED
screen.WATER=WATER_WAVES WATER_REFLECTIONS SUN_REFLECTIONS WATER_WAVE_HEIGHT WATER_OPACITY WATER_REFLECTIVITY WATER_BRIGHTNESS SCREEN_REFLECTIONS SSR_STEPS SSR_STRENGTH
screen.POST=TONEMAPPING EXPOSURE SATURATION CONTRAST COLOR_STRENGTH SSAO SSAO_STRENGTH BLOOM BLOOM_STRENGTH VIGNETTE VIGNETTE_STRENGTH
screen.SHADOW.columns=2
screen.SKY.columns=2
screen.CLOUD.columns=2
screen.FOLIAGE.columns=2
screen.WATER.columns=2
screen.POST.columns=2
sliders=shadowDistance shadowMapResolution SHADOW_SOFTNESS SHADOW_CONTRAST SUN_WARMTH TORCH_WARMTH FOG_DISTANCE FOG_STRENGTH LEAF_DITHER_AMOUNT LEAF_LIGHT_STRENGTH NIGHT_LIGHT SUNLIGHT_STRENGTH SUN_SHAFT_STRENGTH WIND_STRENGTH WIND_SPEED WATER_WAVE_HEIGHT WATER_OPACITY WATER_REFLECTIVITY WATER_BRIGHTNESS SSR_STEPS SSR_STRENGTH CLOUD_COVERAGE CLOUD_DENSITY CLOUD_SPEED CLOUD_SCALE CLOUD_HEIGHT STAR_DENSITY STAR_BRIGHTNESS EXPOSURE SATURATION CONTRAST COLOR_STRENGTH BLOOM_STRENGTH SSAO_STRENGTH VIGNETTE_STRENGTH

# All profiles share the same switches, so switching presets produces a real
# change in GPU workload and in the final rendered image.
profile.FAST=!SHADOWS !NIGHT_SHADOWS !SOFT_SHADOWS !SCREEN_REFLECTIONS !SUN_SHAFTS !CLOUD_SHADOWS !SSAO !BLOOM !AURORA_BOREALIS DISTANCE_FOG PROCEDURAL_CLOUDS NIGHT_STARS WAVING_LEAVES WAVING_PLANTS WATER_WAVES WATER_REFLECTIONS shadowMapResolution:512 shadowDistance:32.0 SHADOW_SAMPLES:1 CLOUD_DETAIL:2 EXPOSURE:1.16
profile.BALANCED=SHADOWS NIGHT_SHADOWS SOFT_SHADOWS SCREEN_REFLECTIONS LEAF_TRANSMISSION LEAF_SHADOW_DITHER WAVING_LEAVES WAVING_PLANTS WATER_WAVES WATER_REFLECTIONS SUN_REFLECTIONS PROCEDURAL_CLOUDS NIGHT_STARS SUN_SHAFTS ATMOSPHERIC_HAZE DISTANCE_FOG TONEMAPPING VIGNETTE !CLOUD_SHADOWS !SSAO !BLOOM !AURORA_BOREALIS shadowMapResolution:1024 shadowDistance:64.0 SHADOW_SAMPLES:2 SSR_STEPS:8 CLOUD_DETAIL:3
profile.HIGH=profile.BALANCED CLOUD_SHADOWS SSAO BLOOM shadowMapResolution:1536 shadowDistance:96.0 SHADOW_SAMPLES:4 SSR_STEPS:12 CLOUD_DETAIL:3 SUN_SHAFT_SAMPLES:6
profile.ULTRA=profile.HIGH AURORA_BOREALIS shadowMapResolution:2048 shadowDistance:128.0 SSR_STEPS:16 CLOUD_DETAIL:4 SUN_SHAFT_SAMPLES:8
