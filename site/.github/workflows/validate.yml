name: Validate contribution

on:
  pull_request:
  push:
    branches-ignore: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check catalog is up to date, valid and tested
        run: npm run check
      - name: Confirm the generated catalog matches the sources
        run: node scripts/build-catalog.mjs --check
