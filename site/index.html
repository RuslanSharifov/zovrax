<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Zovrax — Minecraft mods</title>
  <meta name="description" content="Zovrax is a creator-reviewed library of free and premium Minecraft Java Edition mods.">
  <meta name="theme-color" content="#0a0f0c">
  <meta name="color-scheme" content="dark light">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Zovrax — Minecraft mods, reimagined">
  <meta property="og:description" content="Free and premium Minecraft Java Edition mods in one creator-driven catalog.">
  <meta property="og:url" content="https://ruslansharifov.github.io/zovrax/">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap">
  <link rel="stylesheet" href="css/styles.css">
  <script>
    (function () {
      var theme = 'dark';
      try {
        var stored = JSON.parse(localStorage.getItem('zovrax.theme'));
        if (stored === 'light' || stored === 'dark') theme = stored;
        else if (window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches) theme = 'light';
      } catch (e) { /* storage unavailable: keep default */ }
      document.documentElement.dataset.theme = theme;
      document.documentElement.style.colorScheme = theme;
    })();
  </script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <div id="site-header"></div>
  <main id="main" tabindex="-1">
    <div id="app" class="app-view"></div>
  </main>
  <div id="site-footer"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <noscript><p class="noscript">Zovrax needs JavaScript to browse the catalog. You can still open the mods on GitHub.</p></noscript>
  <script type="module" src="js/main.js"></script>
</body>
</html>
